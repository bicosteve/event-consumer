# Local development stack for event-consumer.
#
#   - mysql           : application database (schema.sql is loaded by the app via DB_MODE)
#   - rabbitmq        : message broker + management UI on http://localhost:15672
#   - event-consumer  : the Spring Boot app, built from Dockerfile.dev with
#                       hot-reload (source is bind-mounted, DevTools restarts on change)
#
# Usage:
#   docker compose up --build        # start the whole stack
#   docker compose down              # stop and remove containers
#   docker compose down -v           # also wipe the mysql/rabbitmq/m2 volumes
#
# Env vars below use the ${VAR:-default} form: values from a local .env file (or
# your shell) override the defaults, but the stack runs out-of-the-box without one.
# Note that the service hostnames (mysql / rabbitmq) are the defaults so the app
# talks to the other containers, not localhost.

services:
  mysql:
    image: mysql:8.4
    container_name: event-consumer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-sportsbook}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: event-consumer-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  event-consumer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: event-consumer-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5003}:5003"
    environment:
      # --- App / server ---
      SPRING_PROFILES_ACTIVE: dev
      APP_PORT: 5003
      LOGGING_LEVEL: ${LOGGING_LEVEL:-DEBUG}

      # --- Database (points at the mysql service, not localhost) ---
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/sportsbook?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      DB_NAME: ${DB_NAME:-sportsbook}
      DB_MODE: ${DB_MODE:-always}

      # --- RabbitMQ connection (points at the rabbitmq service) ---
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # --- RabbitMQ: matches ---
      RABBITMQ_MATCHES_EXCHANGE: ${RABBITMQ_MATCHES_EXCHANGE:-matches.exchange}
      RABBITMQ_MATCHES_QUEUE: ${RABBITMQ_MATCHES_QUEUE:-matches.queue}
      RABBITMQ_MATCHES_ROUTING_KEY: ${RABBITMQ_MATCHES_ROUTING_KEY:-matches.routing.key}

      # --- RabbitMQ: results ---
      RABBITMQ_RESULTS_EXCHANGE: ${RABBITMQ_RESULTS_EXCHANGE:-results.exchange}
      RABBITMQ_RESULTS_QUEUE: ${RABBITMQ_RESULTS_QUEUE:-results.queue}
      RABBITMQ_RESULTS_ROUTING_KEY: ${RABBITMQ_RESULTS_ROUTING_KEY:-results.routing.key}

      # --- RabbitMQ: transactions ---
      RABBITMQ_TRANSACTIONS_EXCHANGE: ${RABBITMQ_TRANSACTIONS_EXCHANGE:-transactions.exchange}
      RABBITMQ_TRANSACTIONS_QUEUE: ${RABBITMQ_TRANSACTIONS_QUEUE:-transactions.queue}
      RABBITMQ_TRANSACTIONS_ROUTING_KEY: ${RABBITMQ_TRANSACTIONS_ROUTING_KEY:-transactions.routing.key}

      # --- RabbitMQ: wallets ---
      RABBITMQ_WALLETS_EXCHANGE: ${RABBITMQ_WALLETS_EXCHANGE:-wallets.exchange}
      RABBITMQ_WALLETS_QUEUE: ${RABBITMQ_WALLETS_QUEUE:-wallets.queue}
      RABBITMQ_WALLETS_ROUTING_KEY: ${RABBITMQ_WALLETS_ROUTING_KEY:-wallets.routing.key}
    volumes:
      # Bind-mount source for DevTools hot-reload (edits restart the app).
      - ./src:/app/src
      # Persist the Maven repo so dependencies aren't re-downloaded each run.
      - event-consumer-m2:/root/.m2

volumes:
  mysql-data:
  event-consumer-m2:
