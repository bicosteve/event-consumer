spring:
  application:
    name: event-consumer

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      auto-offset-reset: earliest

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      keepalive-time: 30_000 # keep connection alive by testing them every 30s
      minimum-idle: 10 # ensure pool does not die when idle

  sql:
    init:
      # Default to "never" in prod so the managed database schema is not
      # re-initialised on every container start. Override with DB_MODE if needed.
      mode: ${DB_MODE:never}
      data-locations: classpath:schema.sql

app:
  messaging:
    broker: ${MESSAGING_BROKER}
    kafka:
      matches-topic: ${KAFKA_MATCHES_TOPIC:matches.queue}
      results-topic: ${KAFKA_RESULTS_TOPIC:results.queue}
      transactions-topic: ${KAFKA_TRANSACTIONS_TOPIC:transactions.queue}
      matches-group: ${KAFKA_MATCHES_GROUP:event-consumer-matches}
      results-group: ${KAFKA_RESULTS_GROUP:event-consumer-results}
      transactions-group: ${KAFKA_TRANSACTIONS_GROUP:event-consumer-transactions}
      create-topics: ${KAFKA_CREATE_TOPICS:false}
    rabbitmq:
      publisher-timeout-millis: ${RABBITMQ_PUBLISHER_TIMEOUT_MILLIS:10000}
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5671}
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:guest}
      virtual-host: ${RABBITMQ_VHOST:/}
      matches:
        exchange: ${RABBITMQ_MATCHES_EXCHANGE}
        queue: ${RABBITMQ_MATCHES_QUEUE}
        routing-key: ${RABBITMQ_MATCHES_ROUTING_KEY}
        dead-letter-exchange: ${RABBITMQ_MATCHES_DLX:event-consumer.matches.dlx}
        dead-letter-routing-key: ${RABBITMQ_MATCHES_DLK:event-consumer.matches.dlq}
        dead-letter-queue: ${RABBITMQ_MATCHES_DLQ:event-consumer.matches.dlq}
      results:
        exchange: ${RABBITMQ_RESULTS_EXCHANGE}
        queue: ${RABBITMQ_RESULTS_QUEUE}
        routing-key: ${RABBITMQ_RESULTS_ROUTING_KEY}
        dead-letter-exchange: ${RABBITMQ_RESULTS_DLX:event-consumer.results.dlx}
        dead-letter-routing-key: ${RABBITMQ_RESULTS_DLK:event-consumer.results.dlq}
        dead-letter-queue: ${RABBITMQ_RESULTS_DLQ:event-consumer.results.dlq}
      transactions:
        exchange: ${RABBITMQ_TRANSACTIONS_EXCHANGE}
        queue: ${RABBITMQ_TRANSACTIONS_QUEUE}
        routing-key: ${RABBITMQ_TRANSACTIONS_ROUTING_KEY}
        dead-letter-exchange: ${RABBITMQ_TRANSACTIONS_DLX:event-consumer.transactions.dlx}
        dead-letter-routing-key: ${RABBITMQ_TRANSACTIONS_DLK:event-consumer.transactions.dlq}
        dead-letter-queue: ${RABBITMQ_TRANSACTIONS_DLQ:event-consumer.transactions.dlq}
      wallets:
        exchange: ${RABBITMQ_WALLETS_EXCHANGE}
        queue: ${RABBITMQ_WALLETS_QUEUE}
        routing-key: ${RABBITMQ_WALLETS_ROUTING_KEY}

server:
  # Render injects $PORT; the Dockerfile also passes -Dserver.port=$PORT
  # (which takes precedence over this value). Falls back to APP_PORT, then 5003.
  port: ${PORT:${APP_PORT:5003}}

logging:
  config: classpath:event-consumer-logback-spring.xml
  level:
    root: INFO
    com.bixx.event_consumer: ${LOGGING_LEVEL:INFO}
    org.apache.coyote: WARN
    org.springframework.jdbc: WARN
    org.springframework: WARN
