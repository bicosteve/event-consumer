name: Deploy the image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g. latest or a git SHA)"
        required: true
        default: "latest"

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE: bixoloo/event-consumer

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.image_tag }} to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to host VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,alloy/config.alloy"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Pull the image and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DOCKER_IMAGE, IMAGE_TAG
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            cd "${DEPLOY_PATH}"

            if [ ! -f .env ]; then
              echo "
                  ::ERROR::.env not found in ${DEPLOY_PATH}. 
                  Create it from .env.prod-example before deploying."
              exit 1
            fi
            
            export DOCKER_IMAGE="${DOCKER_IMAGE}"
            export IMAGE_TAG="${IMAGE_TAG}"

            echo "Deploying  image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
            
            echo "Pulling image from Docker Hub..."
            docker compose -f docker-compose.prod.yml \
              --env-file .env pull

            echo "Starting/recreating stack..."
            docker compose -f docker-compose.prod.yml \
              --env-file .env up -d --remove-orphans

            echo "Pruning dangling images..."
            docker image prune -f
            
            echo "Current status:"
            docker compose -f docker-compose.prod.yml \
              --env-file .env ps

            echo "Current status:"
            docker compose -f docker-compose.prod.yml \
              --env-file .env ps
            
            echo "Recent event-consumer logs: "
            docker logs event-consumer --tail=30 || true
            
            echo "Recent Alloy logs: "
            docker logs event-consumer-alloy --tail=30 || true

      - name: Deployment summary
        if: always()
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.DOCKER_IMAGE }}:${{ github.event.inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSH user: \`${{ secrets.DEPLOY_USER }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"
